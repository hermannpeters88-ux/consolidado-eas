<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consolidado VG EAS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f7;color:#1a1a2e}

.top{background:linear-gradient(135deg,#701082,#4a0856);color:#fff;padding:14px 26px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:17px;font-weight:700}.top p{font-size:11px;opacity:.65;margin-top:2px}
.btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.25)}

.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 60px}

/* GLOBAL STRIP */
.global{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
.g{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.g-lbl{font-size:9.5px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.g-val{font-size:20px;font-weight:800;line-height:1}
.g-sub{font-size:10.5px;color:#bbb;margin-top:4px}
.green{color:#1a7a40}.red{color:#b71c1c}.dark{color:#1a1a2e}.blue{color:#1a4f7a}.orange{color:#b45309}

/* COMPANY CARD */
.card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden}
.card-top{padding:18px 24px 16px;border-bottom:1px solid #f0ecf8}
.card-name{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.card-name .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot-v{background:#1a7a40;box-shadow:0 0 6px rgba(26,122,64,.5)}
.dot-a{background:#d97706;box-shadow:0 0 6px rgba(217,119,6,.5)}
.dot-r{background:#b71c1c;box-shadow:0 0 6px rgba(183,28,28,.5)}
.card-period{font-size:12px;color:#aaa;font-weight:400;margin-left:auto}

/* 3 BIG METRICS */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid #f0ecf8}
.metric{padding:20px 24px;border-right:1px solid #f0ecf8}
.metric:last-child{border-right:none}
.m-lbl{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.m-val{font-size:28px;font-weight:800;line-height:1;margin-bottom:8px}
.m-compare{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px}
.tag-up{background:#e6f4ec;color:#1a7a40}
.tag-dn{background:#fdecea;color:#b71c1c}
.tag-eq{background:#f3f4f6;color:#888}
.m-sub{font-size:11px;color:#bbb}

/* MONTH TABLE */
.tbl-section{padding:0;overflow-x:auto;border-bottom:1px solid #f0ecf8}
.mtbl{width:100%;border-collapse:collapse;font-size:13px}
.mtbl th{background:#faf8fd;font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.4px;padding:9px 16px;text-align:right;border-bottom:1px solid #f0ecf8}
.mtbl th:first-child{text-align:left;min-width:100px}
.mtbl td{padding:9px 16px;text-align:right;border-bottom:1px solid #faf5fc}
.mtbl td:first-child{text-align:left;font-size:11.5px;font-weight:600;color:#777}
.mtbl tr:last-child td{border-bottom:none}
.mtbl tr.res-row td{font-weight:700}
.mtbl tr.mrg-row td{font-size:12px;color:#999}
.c+{color:#1a7a40}.c-{color:#b71c1c}.cn{color:#555}

/* RESULTADO CHART */
.chart-section{padding:16px 24px;border-bottom:1px solid #f0ecf8}
.chart-lbl{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* YOY */
.yoy{display:grid;grid-template-columns:repeat(3,1fr);background:#faf8fd;padding:14px 24px;gap:16px}
.yoy-item{text-align:center}
.yoy-lbl{font-size:9.5px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.yoy-val{font-size:16px;font-weight:800}
.yoy-sub{font-size:10.5px;color:#bbb;margin-top:2px}

@media(max-width:640px){
  .global{grid-template-columns:repeat(2,1fr)}
  .metrics{grid-template-columns:1fr}
  .metric{border-right:none;border-bottom:1px solid #f0ecf8}
  .yoy{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>

<div class="top">
  <div><h1>Consolidado VG EAS</h1><p>Doble G · VG Asociados · AIMA — <span id="ts">datos 2026</span></p></div>
  <button class="btn" onclick="actualizar()">↻ Actualizar</button>
</div>

<div class="wrap">
  <div class="global" id="globalRow"></div>
  <div id="cardDG"></div>
  <div id="cardVG"></div>
  <div id="cardAIMA"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// DATOS — Estado de Resultados 2026
// Egresos DG = Ingresos - Resultado (datos correctos del spreadsheet)
// ─────────────────────────────────────────────────────────
const MESES = ['Ene','Feb','Mar','Abr','May'];

const EMP = {
  DG: {
    id: 'cardDG', nombre: 'Doble G', color: '#2471a3',
    periodo: 'Ene – Abr 2026',
    ing: [22000000, 24200000, 22655000, 23800000, 0],
    res: [-1873342, -3184000,   113852,  2476250, 0],
    // egr = ing - res
    ing25: [54985000,46735000,34235000,46800000,30200000]
  },
  VG: {
    id: 'cardVG', nombre: 'VG Asociados', color: '#e67e22',
    periodo: 'Ene – May 2026',
    ing: [22363000,16072500,23456050,27675996,21115715],
    res: [ 7449259,-4930953, 7338674,-1670655, 5674707],
    ing25: [4330000,7025000,9405000,13325000,8015000]
  },
  AIMA: {
    id: 'cardAIMA', nombre: 'AIMA', color: '#701082',
    periodo: 'Ene – Mar 2026',
    ing: [24820006,29400013,32210083,0,0],
    res: [ -752649,-3224120, 6799004,0,0],
    ing25: [1500000,1500000,1500000,5300000,5300000]
  }
};

// Calcular egresos desde ing y res
Object.values(EMP).forEach(e => {
  e.egr = e.ing.map((v,i) => v > 0 ? v - e.res[i] : 0);
});

// ─────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────
const Gs  = v => 'Gs. '+(Math.abs(v)/1e6).toFixed(1).replace('.',',')+' M';
const GsS = v => (v>0?'+':v<0?'-':'') + 'Gs. '+(Math.abs(v)/1e6).toFixed(1).replace('.',',')+' M';
const pct = (a,b) => b ? Math.round((a-b)/Math.abs(b)*100) : null;
const li  = a => { let i=-1; a.forEach((v,k)=>{if(v>0)i=k;}); return i; };

function semDot(margen) {
  return margen > 15 ? 'dot-v' : margen > 0 ? 'dot-a' : 'dot-r';
}

function tag(p, invert=false) {
  if (p === null) return '';
  const bueno = invert ? p < 0 : p > 0;
  const cls = p > 0 ? (invert?'tag-dn':'tag-up') : p < 0 ? (invert?'tag-up':'tag-dn') : 'tag-eq';
  return `<span class="tag ${cls}">${p>0?'▲':'▼'} ${Math.abs(p)}% MoM</span>`;
}

// ─────────────────────────────────────────────────────────
// CHART — barras del resultado mensual
// ─────────────────────────────────────────────────────────
function resultChart(res, color, meses) {
  const n = res.filter((_,i)=>meses[i]).length;
  if (!n) return '';
  const maxA = Math.max(...res.map(Math.abs).filter(v=>v>0), 1);
  const BW=44, GAP=18, PL=10, PT=28, PB=24, H=100;
  const W = PL + n*(BW+GAP);
  const sc = v => (H-PT-PB) * (Math.abs(v)/maxA);

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W*1.4}px;display:block;overflow:visible">`;
  // zero line
  svg += `<line x1="${PL}" y1="${H-PB}" x2="${W-4}" y2="${H-PB}" stroke="#e5e7eb" stroke-width="1.5"/>`;

  for (let i=0; i<n; i++) {
    const v = res[i];
    if (!v && v!==0) continue;
    const x = PL + i*(BW+GAP);
    const h = sc(v);
    const pos = v >= 0;
    const y = pos ? H-PB-h : H-PB;
    const fill = pos ? '#1a7a40' : '#b71c1c';
    const opacity = pos ? '.8' : '.7';

    svg += `<rect x="${x}" y="${y}" width="${BW}" height="${h}" rx="3" fill="${fill}" opacity="${opacity}"/>`;
    // Value label
    const ly = pos ? y - 5 : y + h + 12;
    svg += `<text x="${x+BW/2}" y="${ly}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${fill}">${v>=0?'+':''}${(v/1e6).toFixed(1)}</text>`;
    // Month label
    svg += `<text x="${x+BW/2}" y="${H-5}" text-anchor="middle" font-size="10.5" fill="#bbb">${MESES[i]}</text>`;
  }
  svg += '</svg>';
  return svg;
}

// ─────────────────────────────────────────────────────────
// RENDER COMPANY CARD
// ─────────────────────────────────────────────────────────
function renderCard(key, e) {
  const idx  = li(e.ing);
  if (idx < 0) return;

  const ingM = e.ing[idx], egrM = e.egr[idx], resM = e.res[idx];
  const mrgM = ingM ? Math.round(resM/ingM*100) : 0;
  const dot  = semDot(mrgM);

  const idxP = idx > 0 ? idx - 1 : -1;
  const ingP = idxP >= 0 ? e.ing[idxP] : 0;
  const egrP = idxP >= 0 ? e.egr[idxP] : 0;
  const resP = idxP >= 0 ? e.res[idxP] : 0;
  const momI = pct(ingM, ingP);
  const momE = pct(egrM, egrP);

  // Acumulados
  const n      = idx + 1;
  const acIng  = e.ing.slice(0,n).reduce((a,b)=>a+b,0);
  const acEgr  = e.egr.slice(0,n).reduce((a,b)=>a+b,0);
  const acRes  = e.res.slice(0,n).reduce((a,b)=>a+b,0);
  const acMrg  = acIng ? Math.round(acRes/acIng*100) : 0;

  // YoY
  const acI25  = e.ing25.slice(0,n).reduce((a,b)=>a+b,0);
  const yoy    = acI25 ? Math.round((acIng-acI25)/acI25*100) : null;

  // Tabla
  const meses  = MESES.slice(0,n);
  const thCols = meses.map(m=>`<th>${m}</th>`).join('') + '<th>Acum.</th>';

  const fmtI = v => v>0 ? `<span class="cn">${Gs(v)}</span>` : '<span style="color:#ddd">—</span>';
  const fmtE = v => v>0 ? `<span class="c-">${Gs(v)}</span>` : '<span style="color:#ddd">—</span>';
  const fmtR = v => {
    if (!v && v!==0) return '<span style="color:#ddd">—</span>';
    return `<span class="${v>=0?'c+':'c-'}">${GsS(v)}</span>`;
  };
  const fmtM = v => {
    const cl = v>15?'c+':v>0?'cn':'c-';
    return `<span class="${cl}">${v>0?'+':''}${v}%</span>`;
  };

  const mrgData = e.ing.map((v,i) => v ? Math.round(e.res[i]/v*100) : 0);

  document.getElementById(e.id).innerHTML = `
<div class="card">
  <div class="card-top">
    <div class="card-name">
      <span class="dot ${dot}"></span>
      ${e.nombre}
      <span class="card-period">${e.periodo}</span>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="m-lbl">Ingresos — ${MESES[idx]}</div>
      <div class="m-val dark">${Gs(ingM)}</div>
      <div class="m-compare">
        ${tag(momI)}
        <span class="m-sub">${idxP>=0?'vs '+MESES[idxP]:''}</span>
      </div>
    </div>
    <div class="metric">
      <div class="m-lbl">Egresos — ${MESES[idx]}</div>
      <div class="m-val red">${Gs(egrM)}</div>
      <div class="m-compare">
        ${tag(momE,true)}
        <span class="m-sub">${idxP>=0?'vs '+MESES[idxP]:''}</span>
      </div>
    </div>
    <div class="metric">
      <div class="m-lbl">Resultado — ${MESES[idx]}</div>
      <div class="m-val ${resM>=0?'green':'red'}">${GsS(resM)}</div>
      <div class="m-compare">
        <span class="tag ${resM>0?'tag-up':'tag-dn'}">${mrgM>0?'+':''}${mrgM}% margen</span>
        <span class="m-sub">Acum: ${acMrg>0?'+':''}${acMrg}%</span>
      </div>
    </div>
  </div>

  <div class="tbl-section">
    <table class="mtbl">
      <thead><tr><th>Concepto</th>${thCols}</tr></thead>
      <tbody>
        <tr><td>Ingresos</td>${e.ing.slice(0,n).map(fmtI).map(v=>`<td>${v}</td>`).join('')}<td>${fmtI(acIng)}</td></tr>
        <tr><td>Egresos</td>${e.egr.slice(0,n).map(fmtE).map(v=>`<td>${v}</td>`).join('')}<td>${fmtE(acEgr)}</td></tr>
        <tr class="res-row"><td>Resultado</td>${e.res.slice(0,n).map(fmtR).map(v=>`<td>${v}</td>`).join('')}<td>${fmtR(acRes)}</td></tr>
        <tr class="mrg-row"><td>Margen %</td>${mrgData.slice(0,n).map(fmtM).map(v=>`<td>${v}</td>`).join('')}<td>${fmtM(acMrg)}</td></tr>
      </tbody>
    </table>
  </div>

  <div class="chart-section">
    <div class="chart-lbl">Resultado mensual (Gs.)</div>
    ${resultChart(e.res, e.color, MESES.slice(0,n).map(()=>true))}
  </div>

  <div class="yoy">
    <div class="yoy-item">
      <div class="yoy-lbl">Ingresos acum. 2026</div>
      <div class="yoy-val dark">${Gs(acIng)}</div>
      <div class="yoy-sub">Ene – ${MESES[idx]}</div>
    </div>
    <div class="yoy-item">
      <div class="yoy-lbl">Mismo período 2025</div>
      <div class="yoy-val" style="color:#aaa">${acI25 > 0 ? Gs(acI25) : '—'}</div>
      <div class="yoy-sub">Ene – ${MESES[idx]}</div>
    </div>
    <div class="yoy-item">
      <div class="yoy-lbl">Variación año a año</div>
      <div class="yoy-val ${yoy>=0?'green':'red'}">${yoy!==null?(yoy>=0?'+':'')+yoy+'%':'—'}</div>
      <div class="yoy-sub">${yoy>=0?'▲ Creció vs 2025':'▼ Cayó vs 2025'}</div>
    </div>
  </div>
</div>`;
}

// ─────────────────────────────────────────────────────────
// GLOBAL STRIP
// ─────────────────────────────────────────────────────────
function renderGlobal() {
  const all   = Object.values(EMP);
  const totI  = all.reduce((s,e)=>s+e.ing.reduce((a,b)=>a+b,0),0);
  const totE  = all.reduce((s,e)=>s+e.egr.reduce((a,b)=>a+b,0),0);
  const totR  = all.reduce((s,e)=>s+e.res.reduce((a,b)=>a+b,0),0);
  const totM  = totI ? Math.round(totR/totI*100) : 0;
  const totI25= all.reduce((s,e)=>{
    const n = li(e.ing)+1;
    return s + e.ing25.slice(0,n).reduce((a,b)=>a+b,0);
  },0);
  const yoy   = totI25 ? Math.round((totI-totI25)/totI25*100) : null;

  document.getElementById('globalRow').innerHTML = `
    <div class="g"><div class="g-lbl">Total Ingresos</div><div class="g-val dark">${Gs(totI)}</div><div class="g-sub">Consolidado 2026</div></div>
    <div class="g"><div class="g-lbl">Total Egresos</div><div class="g-val red">${Gs(totE)}</div><div class="g-sub">Consolidado 2026</div></div>
    <div class="g"><div class="g-lbl">Resultado Neto</div><div class="g-val ${totR>=0?'green':'red'}">${GsS(totR)}</div><div class="g-sub">Ingresos − Egresos</div></div>
    <div class="g"><div class="g-lbl">Margen Neto</div><div class="g-val ${totM>10?'green':totM>0?'orange':'red'}">${totM>0?'+':''}${totM}%</div><div class="g-sub">Resultado / Ingresos</div></div>
    <div class="g"><div class="g-lbl">Ingresos vs 2025</div><div class="g-val ${yoy>=0?'green':'red'}">${yoy!==null?(yoy>=0?'+':'')+yoy+'%':'—'}</div><div class="g-sub">Año a año</div></div>`;
}

function renderAll() {
  renderGlobal();
  Object.entries(EMP).forEach(([k,e]) => renderCard(k,e));
}

renderAll();

// ─────────────────────────────────────────────────────────
// LIVE — actualiza ingresos 2025/2026 desde Resumen sheet
// ─────────────────────────────────────────────────────────
const SHEET = '1Jkq3un1AAmthg6PHxht5c8EfFK9oU9iyKgu8XSiLy-Y';
function gviz(s){
  return new Promise((res,rej)=>{
    const cb='_g'+Date.now();const t=setTimeout(()=>{delete window[cb];rej();},8000);
    window[cb]=d=>{clearTimeout(t);delete window[cb];res((d.table.rows||[]).map(r=>r.c.map(c=>c?c.v:null)));};
    const el=document.createElement('script');
    el.src=`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=responseHandler:${cb}&sheet=${encodeURIComponent(s)}`;
    el.onerror=()=>{clearTimeout(t);delete window[cb];rej();};
    document.head.appendChild(el);
  });
}

async function actualizar(){
  const btn=document.querySelector('.btn');
  btn.textContent='⏳';btn.disabled=true;
  try{
    const rows=await gviz('Resumen');
    let modo='';
    rows.forEach(row=>{
      const l0=String(row[0]||'').trim().toUpperCase();
      const l1=String(row[1]||'').trim().toLowerCase();
      if(l0==='REAL 2026')modo='r26';
      if(l0==='2025')modo='r25';
      if(l0.includes('OBJETIVO')||l0.startsWith('VS PRES'))modo='';
      const v=row.slice(2,7).map(x=>x!=null?Number(x):0);
      if(modo==='r26'){
        // Solo actualiza ingresos; egresos y resultado quedan del P&L
        if(l1.includes('doble'))EMP.DG.ing=v;
        if(l1.includes('vg'))EMP.VG.ing=v;
        if(l1.includes('aim'))EMP.AIMA.ing=v;
      }
      if(modo==='r25'){
        if(l1.includes('doble'))EMP.DG.ing25=v;
        if(l1.includes('vg'))EMP.VG.ing25=v;
        if(l1.includes('aim'))EMP.AIMA.ing25=v;
      }
    });
    renderAll();
    document.getElementById('ts').textContent='act. '+new Date().toLocaleString('es-PY',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    btn.textContent='✅';
  }catch{btn.textContent='⚠️';}
  setTimeout(()=>{btn.textContent='↻ Actualizar';btn.disabled=false;},3000);
}
</script>
</body>
</html>
